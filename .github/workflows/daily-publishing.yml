name: Daily AI article generation

on:
  workflow_dispatch:
  schedule:
    # 08:15 Asia/Shanghai = 00:15 UTC
    - cron: '15 0 * * *'

permissions:
  contents: write

concurrency:
  group: daily-ai-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ai_daily_env
    timeout-minutes: 20
    env:
      WEEKLY_DAY_AI_BASE_URL: ${{ vars.WEEKLY_DAY_AI_BASE_URL }}
      WEEKLY_DAY_AI_API_KEY: ${{ secrets.WEEKLY_DAY_AI_API_KEY }}
      WEEKLY_DAY_AI_MODEL: ${{ vars.WEEKLY_DAY_AI_MODEL }}
      WEEKLY_DAY_AI_TEMPERATURE: ${{ vars.WEEKLY_DAY_AI_TEMPERATURE || '0.4' }}
      WEEKLY_DAY_AI_MAX_TOKENS: ${{ vars.WEEKLY_DAY_AI_MAX_TOKENS || '5000' }}
      WEEKLY_DAY_AI_REQUEST_TIMEOUT_MS: ${{ vars.WEEKLY_DAY_AI_REQUEST_TIMEOUT_MS || '90000' }}
      WEEKLY_DAY_AI_REQUEST_RETRIES: ${{ vars.WEEKLY_DAY_AI_REQUEST_RETRIES || '2' }}
      HN_FETCH_LIMIT: ${{ vars.HN_FETCH_LIMIT || '50' }}
      HN_AI_KEYWORDS: ${{ vars.HN_AI_KEYWORDS || '' }}
      HN_MIN_SCORE: ${{ vars.HN_MIN_SCORE || '50' }}
      HN_MIN_COMMENTS: ${{ vars.HN_MIN_COMMENTS || '10' }}
      HN_FETCH_CONCURRENCY: ${{ vars.HN_FETCH_CONCURRENCY || '8' }}
      HN_REQUEST_TIMEOUT_MS: ${{ vars.HN_REQUEST_TIMEOUT_MS || '12000' }}
      HN_REQUEST_RETRIES: ${{ vars.HN_REQUEST_RETRIES || '3' }}
      DAILY_ARTICLE_COUNT: ${{ vars.DAILY_ARTICLE_COUNT || '2' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.12.0'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate two bilingual Hacker News articles
        run: pnpm content:ai:publish

      - name: Run content tests
        run: pnpm test:content

      - name: Build Astro site
        run: pnpm build

      - name: Commit generated articles
        id: commit-articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated-posts
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new articles were generated."
          else
            git commit -m "自动发布每日 Hacker News AI 文章"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

