name: Daily AI article generation

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "关键词（用 HN Algolia 搜索选题，留空则用热门榜）"
        required: false
        type: string
      article_urls:
        description: "文章链接（空格分隔，直接读取创作；填写后忽略关键词）"
        required: false
        type: string
  schedule:
    # 主:北京 6:47(UTC 22:47 低峰时段);备:北京 10:23(UTC 02:23)双保险
    # 近 10 小时内已有文章提交则跳过定时执行,避免重复发布
    - cron: "47 22 * * *"
    - cron: "23 2 * * *"

permissions:
  contents: write

concurrency:
  group: daily-ai-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ai_daily_env
    timeout-minutes: 30
    env:
      WEEKLY_DAY_AI_BASE_URL: ${{ vars.WEEKLY_DAY_AI_BASE_URL }}
      WEEKLY_DAY_AI_API_KEY: ${{ secrets.WEEKLY_DAY_AI_API_KEY }}
      WEEKLY_DAY_AI_MODEL: ${{ vars.WEEKLY_DAY_AI_MODEL }}
      WEEKLY_DAY_AI_TEMPERATURE: ${{ vars.WEEKLY_DAY_AI_TEMPERATURE || '0.4' }}
      WEEKLY_DAY_AI_MAX_TOKENS: ${{ vars.WEEKLY_DAY_AI_MAX_TOKENS || '3500' }}
      WEEKLY_DAY_AI_REQUEST_TIMEOUT_MS: ${{ vars.WEEKLY_DAY_AI_REQUEST_TIMEOUT_MS || '240000' }}
      WEEKLY_DAY_AI_REQUEST_RETRIES: ${{ vars.WEEKLY_DAY_AI_REQUEST_RETRIES || '3' }}
      HN_FETCH_LIMIT: ${{ vars.HN_FETCH_LIMIT || '50' }}
      HN_AI_KEYWORDS: ${{ vars.HN_AI_KEYWORDS || '' }}
      HN_MIN_SCORE: ${{ vars.HN_MIN_SCORE || '50' }}
      HN_MIN_COMMENTS: ${{ vars.HN_MIN_COMMENTS || '10' }}
      HN_FETCH_CONCURRENCY: ${{ vars.HN_FETCH_CONCURRENCY || '8' }}
      HN_REQUEST_TIMEOUT_MS: ${{ vars.HN_REQUEST_TIMEOUT_MS || '12000' }}
      HN_REQUEST_RETRIES: ${{ vars.HN_REQUEST_RETRIES || '3' }}
      DAILY_ARTICLE_COUNT: ${{ vars.DAILY_ARTICLE_COUNT || '2' }}
      ARTICLE_TOPIC: ${{ github.event.inputs.topic || '' }}
      ARTICLE_URLS: ${{ github.event.inputs.article_urls || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Skip if an auto-run published recently
        id: freshness-guard
        if: github.event_name == 'schedule'
        run: |
          recent=$(git log --since="10 hours ago" --oneline -- src/data/generated-posts | head -n 1)
          if [ -n "$recent" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "近 10 小时已有文章提交,跳过本次定时执行:$recent"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.freshness-guard.outputs.skip != 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        if: steps.freshness-guard.outputs.skip != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: "22.12.0"
          cache: pnpm

      - name: Install dependencies
        if: steps.freshness-guard.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Show article generation settings
        if: steps.freshness-guard.outputs.skip != 'true'
        run: |
          echo "AI model: $WEEKLY_DAY_AI_MODEL"
          echo "AI request timeout: $WEEKLY_DAY_AI_REQUEST_TIMEOUT_MS ms"
          echo "AI request retries: $WEEKLY_DAY_AI_REQUEST_RETRIES"
          echo "AI max tokens: $WEEKLY_DAY_AI_MAX_TOKENS"

      - name: Generate two bilingual Hacker News articles
        if: steps.freshness-guard.outputs.skip != 'true'
        run: pnpm content:ai:publish

      - name: Run content tests
        if: steps.freshness-guard.outputs.skip != 'true'
        run: pnpm test:content

      - name: Build Astro site
        if: steps.freshness-guard.outputs.skip != 'true'
        run: pnpm build

      - name: Commit generated articles
        id: commit-articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/generated-posts
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new articles were generated."
          else
            git commit -m "自动发布每日 AI 文章"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
