name = "view-counter"
main = "src/worker.js"
compatibility_date = "2026-08-01"

[[kv_namespaces]]
binding = "VIEWS"
# 部署前先运行: npx wrangler kv namespace create VIEWS
# 然后把输出的 id 填到这里
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# CORS 白名单（精确匹配，不带末尾斜杠）
ALLOWED_ORIGINS = "http://localhost:4321,https://ai.weekly-day.top"
